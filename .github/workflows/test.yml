name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        cd backend
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy
      run: |
        cd backend
        mypy src/ --ignore-missing-imports || true

    - name: Run tests with pytest
      run: |
        cd backend
        pytest tests/ -v --cov=src --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        flags: unittests
        fail_ci_if_error: false

  frontend-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check HTML validity
      run: |
        # Basic check that HTML file exists and has required content
        if [ ! -f "frontend/src/index.html" ]; then
          echo "Frontend HTML file not found"
          exit 1
        fi

        # Check for critical elements
        grep -q "JewelRender" frontend/src/index.html || exit 1
        grep -q "<script" frontend/src/index.html || exit 1
